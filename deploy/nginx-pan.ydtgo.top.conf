# PanRadar 反代配置（可选）：ECS 上用 nginx 做 TLS 终结 + 反代
# 放置：/etc/nginx/sites-available/pan.ydtgo.top  -> 软链到 /etc/nginx/sites-enabled/
# 证书可用 certbot： certbot --nginx -d pan.ydtgo.top
# 若改用阿里云 CDN/SLB 终结 TLS，则不需要本文件，Python 直接暴露 0.0.0.0:8931 即可。

server {
    listen 80;
    server_name pan.ydtgo.top;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name pan.ydtgo.top;

    ssl_certificate     /etc/letsencrypt/live/pan.ydtgo.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pan.ydtgo.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8931;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
